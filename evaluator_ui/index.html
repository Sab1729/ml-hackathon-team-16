<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Review 1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f4; color: #132b30; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; padding: clamp(16px, 4vw, 48px); }
    h1 { font-size: 2rem; margin: 0 0 20px; }
    .panel { background: white; border: 1px solid #c9d5d7; border-radius: 12px; padding: 18px; }
    form, .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
    label { display: grid; gap: 4px; font-weight: 600; }
    input, select, button { font: inherit; border: 1px solid #627a80; border-radius: 6px; padding: 8px 12px; }
    input { width: min(100%, 320px); }
    button { background: #075e54; color: white; cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    #status { min-height: 1.5em; margin: 12px 0; }
    #status.error { color: #a01f26; }
    canvas { display: block; width: 100%; height: clamp(320px, 60vh, 620px); background: #f4f8f8; border: 1px solid #c9d5d7; border-radius: 8px; }
    .legend { margin-top: 12px; }
    .legend label { display: flex; gap: 6px; align-items: center; font-weight: 400; }
    .dot, .line { width: 14px; background: #2753a5; height: 8px; border-radius: 4px; }
    .line { background: #04745e; height: 4px; }
    dl { display: flex; flex-wrap: wrap; gap: 16px 30px; margin-bottom: 0; }
    dd { margin: 0; font-weight: 700; font-size: 1.25rem; }
    ul:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>PathSnap <small>Review 1</small></h1>
    <section class="panel" aria-label="Trip viewer">
      <form id="controls">
        <label>API address <input id="api" type="url" required></label>
        <button type="submit">Load trips</button>
        <label>Trip <select id="trips" disabled><option value="">Select a trip</option></select></label>
        <button type="button" id="retry" disabled>Retry prediction</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <canvas id="map" aria-label="Plan view of GPS observations and predicted route"></canvas>
      <div class="legend">
        <label><input id="show-gps" type="checkbox" checked><span class="dot"></span>GPS observations</label>
        <label><input id="show-route" type="checkbox" checked><span class="line"></span>Predicted route</label>
      </div>
      <dl id="metrics" aria-label="Trip metrics"></dl>
      <ul id="warnings" aria-label="Route warnings"></ul>
    </section>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const api = byId("api");
    const trips = byId("trips");
    const retry = byId("retry");
    const canvas = byId("map");
    const status = byId("status");
    const metrics = byId("metrics");
    const warnings = byId("warnings");
    let request = null;
    let result = null;
    api.value = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8000";

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle("error", error);
    }

    function nextRequest() {
      request?.abort();
      request = new AbortController();
      return request.signal;
    }

    async function fetchJSON(path, signal, options = {}) {
      const address = api.value.trim().replace(/\/+$/, "");
      const response = await fetch(address + path, { ...options, signal });
      const payload = await response.json();
      if (!response.ok) throw new Error(
        typeof payload.detail === "string" ? payload.detail : `HTTP ${response.status}`
      );
      return payload;
    }

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      if (!result) return;

      const gps = result.gps.coordinates;
      const sections = result.predicted_route.coordinates;
      const points = gps.concat(sections.flat());
      if (!points.length) return;
      let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
      for (const [lon, lat] of points) {
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      }
      const lonScale = Math.cos((minLat + maxLat) * Math.PI / 360);
      const scale = Math.min(
        (width - 40) / Math.max((maxLon - minLon) * lonScale, 1e-7),
        (height - 40) / Math.max(maxLat - minLat, 1e-7)
      );
      const project = ([lon, lat]) => [
        width / 2 + (lon - (minLon + maxLon) / 2) * lonScale * scale,
        height / 2 - (lat - (minLat + maxLat) / 2) * scale
      ];

      if (byId("show-route").checked) {
        ctx.strokeStyle = "#04745e";
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        for (const line of sections) {
          ctx.beginPath();
          line.forEach((point, index) => {
            const [x, y] = project(point);
            if (index) ctx.lineTo(x, y);
            else ctx.moveTo(x, y);
          });
          ctx.stroke();
        }
      }
      if (byId("show-gps").checked) {
        ctx.fillStyle = "#2753a5";
        for (const point of gps) {
          const [x, y] = project(point);
          ctx.beginPath();
          ctx.arc(x, y, 2.3, 0, 2 * Math.PI);
          ctx.fill();
        }
      }
    }

    function show(data) {
      result = data;
      metrics.replaceChildren();
      warnings.replaceChildren();
      if (data) {
        const values = data.metrics ?? {};
        const percentage = values.provisional_accuracy == null
          ? "Unavailable" : `${(values.provisional_accuracy * 100).toFixed(2)}%`;
        for (const [name, value] of [
          ["GPS observations", values.observation_count],
          ["Matched observations", values.matched_count],
          ["Route sections", values.route_section_count],
          ["Provisional accuracy", percentage]
        ]) {
          const item = document.createElement("div");
          const title = document.createElement("dt");
          const number = document.createElement("dd");
          title.textContent = name;
          number.textContent = value ?? "Unavailable";
          item.append(title, number);
          metrics.append(item);
        }
        for (const message of data.warnings ?? []) {
          const item = document.createElement("li");
          item.textContent = message.replaceAll("_", " ");
          warnings.append(item);
        }
      }
      draw();
    }

    async function loadTrips(event) {
      event?.preventDefault();
      const signal = nextRequest();
      trips.replaceChildren(new Option("Select a trip", ""));
      trips.disabled = retry.disabled = true;
      show(null);
      setStatus("Loading development trips…");
      try {
        const response = await fetchJSON("/trips", signal);
        if (signal.aborted) return;
        for (const id of response.trip_ids) trips.add(new Option(id, id));
        trips.disabled = !response.trip_ids.length;
        setStatus(response.trip_ids.length ? "Select a development trip." : "No trips available.");
      } catch (error) {
        if (!signal.aborted) setStatus(`Could not load trips. ${error.message}`, true);
      }
    }

    async function predict() {
      const signal = nextRequest();
      const trip = trips.value;
      show(null);
      retry.disabled = true;
      if (!trip) {
        setStatus("Select a development trip.");
        return;
      }
      setStatus(`Reconstructing trip ${trip}…`);
      try {
        const response = await fetchJSON("/predict", signal, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trip_id: trip })
        });
        if (signal.aborted) return;
        if (response.trip_id !== trip) throw new Error("Unexpected trip in response.");
        show(response);
        setStatus(`Showing trip ${trip}.`);
      } catch (error) {
        if (!signal.aborted) {
          setStatus(`Prediction failed. ${error.message}`, true);
          retry.disabled = false;
        }
      }
    }

    byId("controls").addEventListener("submit", loadTrips);
    trips.addEventListener("change", predict);
    retry.addEventListener("click", predict);
    byId("show-gps").addEventListener("change", draw);
    byId("show-route").addEventListener("change", draw);
    new ResizeObserver(draw).observe(canvas);
    loadTrips();
  </script>
</body>
</html>
